
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Member Sign In | NeuroFusion Living</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    :root {
      --forest: #193d39;
      --sage: #e9f0e9;
      --cream: #f8f6f0;
      --blush: #f5e2dd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, var(--sage), var(--cream) 55%, var(--blush));
      color: var(--forest);
      font-family: Arial, sans-serif;
    }
    .panel {
      width: 100%;
      max-width: 460px;
      padding: 46px 38px;
      background: #fffdfb;
      border: 1px solid #e8e3dc;
      border-radius: 24px;
      box-shadow: 0 18px 60px #193d3910;
    }
    h1 {
      margin: 0 0 8px;
      text-align: center;
      font: 42px Georgia, serif;
    }
    .subtitle {
      text-align: center;
      line-height: 1.7;
      color: #60756f;
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 13px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d8ded7;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 16px;
      margin-top: 24px;
      background: var(--forest);
      color: white;
      border: 0;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .links { margin-top: 24px; text-align: center; }
    .links button {
      width: auto;
      padding: 0;
      margin: 8px;
      background: none;
      color: var(--forest);
      text-decoration: underline;
    }
    #message {
      margin-top: 18px;
      line-height: 1.6;
      font-size: 14px;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: var(--forest);
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>NeuroFusion Living</h1>
    <p class="subtitle">Your space to live well.<br>Welcome back to yourself.</p>

    <form id="auth-form">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" minlength="12" autocomplete="current-password" required>

      <button id="submit-button" type="submit">Sign in</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="links">
      <button type="button" id="register">Create an account</button>
      <button type="button" id="reset">Forgot password?</button>
    </div>

    <a class="back" href="/living.html">← Back to NeuroFusion Living</a>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const message = document.getElementById("message");
    const submit = document.getElementById("submit-button");
    const password = document.getElementById("password");
    const register = document.getElementById("register");
    const reset = document.getElementById("reset");
    const form = document.getElementById("auth-form");

    let mode = "signin";
    let supabase;

    try {
      const response = await fetch("/api/auth-config", { cache: "no-store" });
      if (!response.ok) throw new Error("Authentication is unavailable.");
      const config = await response.json();
      if (!config.supabaseUrl || !config.supabasePublishableKey) {
        throw new Error("Authentication configuration is missing.");
      }
      supabase = createClient(config.supabaseUrl, config.supabasePublishableKey);
    } catch {
      message.textContent = "Sign-in is temporarily unavailable. Please try again later.";
      submit.disabled = true;
    }

    register.addEventListener("click", () => {
      mode = mode === "signup" ? "signin" : "signup";
      submit.textContent = mode === "signup" ? "Create account" : "Sign in";
      register.textContent = mode === "signup" ? "Already have an account? Sign in" : "Create an account";
      password.autocomplete = mode === "signup" ? "new-password" : "current-password";
      message.textContent = "";
    });

    reset.addEventListener("click", async () => {
      if (!supabase) return;
      const email = document.getElementById("email").value.trim();
      if (!email) {
        message.textContent = "Please enter your email address first.";
        return;
      }
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: location.origin + "/auth/callback"
      });
      message.textContent = error
        ? "We couldn't process that request. Please try again."
        : "If an account exists for this email, you'll receive password reset instructions.";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!supabase) return;

      submit.disabled = true;
      message.textContent = "";

      const email = document.getElementById("email").value.trim();
      const pass = password.value;

      try {
        if (mode === "signup") {
          const { error } = await supabase.auth.signUp({
            email,
            password: pass,
            options: {
              emailRedirectTo: location.origin + "/auth/callback"
            }
          });
          if (error) throw error;
          message.textContent = "Please check your email for your verification link.";
        } else {
          const { error } = await supabase.auth.signInWithPassword({
            email,
            password: pass
          });
          if (error) throw error;
          message.textContent = "Signed in successfully. Opening your Living Space...";
window.location.assign("/members/");
        }
      } catch (error) {
        message.textContent = error.message || "Something went wrong.";
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
